name: Snyk IaC Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write   # Needed to upload SARIF to GitHub Security tab
  pull-requests: write     # Optional: lets Snyk comment on PRs

jobs:
  snyk-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk IaC scan & generate SARIF
        continue-on-error: true   # don't fail CI on findings (change if you want hard fail)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk iac test --sarif --severity-threshold=high > snyk-iac.sarif

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-iac.sarif
